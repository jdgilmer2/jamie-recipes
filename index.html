<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jamie's Hub</title>
  <style>
    :root{--bg:#0b1220;--card:#111827;--line:#1f2937;--text:#e5e7eb;--muted:#9ca3af;--accent:#60a5fa}
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#08101d,#0b1220);color:var(--text)}
    .wrap{max-width:900px;margin:0 auto;padding:28px 16px}
    h1{margin:0 0 6px}
    p{color:var(--muted)}
    .grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:18px}
    @media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
    .card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
    .card:hover{border-color:#334155;transform:translateY(-1px)}
    .title{font-size:1.2rem;font-weight:700;margin-bottom:6px}
    .pill{display:inline-block;background:#0f233f;border:1px solid #274671;color:#93c5fd;border-radius:999px;padding:2px 10px;font-size:.75rem}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Jamie's Home</h1>
    <p>Quick menu</p>
    <div class="grid">
      <a class="card" href="./recipes.html">
        <span class="pill">Recipes</span>
        <div class="title">Recipe Book</div>
        <div>Open your full recipe collection.</div>
      </a>
      <a class="card" href="./7-day-reset.html">
        <span class="pill">Reset</span>
        <div class="title">7 Day Confidence Reset</div>
        <div>Daily checklist + scoreboard.</div>
      </a>
      <a class="card" href="./home-improvements-planner.html">
        <span class="pill">Home</span>
        <div class="title">Home Improvements Planner</div>
        <div>Projects, materials/labor costs, priority sorting, and totals.</div>
      </a>
    </div>
  </div>
</body>
</html>
